<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CivicPulse - AI decision support for public grievance offices" />
    <meta name="theme-color" content="#0B0F1A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>CivicPulse</title>
    <script>
      // apply the saved theme before first paint (Aurora Glass is dark unless the user chose or prefers light)
      try {
        var t = localStorage.getItem("civicpulse-theme");
        var light = t === "light" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("dark", !light);
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
