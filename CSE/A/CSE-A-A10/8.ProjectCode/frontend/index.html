<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlowSense - camera-to-signal traffic control: detect, predict, adapt and coordinate across junctions." />
    <meta name="theme-color" content="#0d0d0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FlowSense - adaptive traffic control room</title>
    <script>
      // Apply the saved theme before first paint (no flash). Falls back to the OS preference.
      try {
        var t = localStorage.getItem('fs_theme')
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
