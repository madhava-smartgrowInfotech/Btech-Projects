<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PneumoDetect: upload a chest X-ray, get a Normal / Bacterial / Viral classification with a Grad-CAM explanation." />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PneumoDetect - Pneumonia Detection Using Deep Learning</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('pd.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
