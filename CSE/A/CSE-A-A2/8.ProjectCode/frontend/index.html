<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ResQAI detects road accidents from sensor data, rates their severity and dispatches an emergency response." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ResQAI - Accident detection and emergency response</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var t = localStorage.getItem('resqai.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
