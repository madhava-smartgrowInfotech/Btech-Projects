<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CipherGuard Shield - AES-256-GCM secure transfer and ML intrusion detection for cloud data transmission." />
    <meta name="color-scheme" content="dark light" />
    <title>CipherGuard Shield - Secure Data Transmission</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved (or OS) theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('cg_theme')
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CipherGuard Shield needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
