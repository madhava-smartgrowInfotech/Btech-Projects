{% extends "base.html" %}{% block title %}Sign in — CareLens AI{% endblock %}
{% block content %}<section class="auth-wrap"><div class="card auth-card">
<h2>Welcome back</h2><p class="muted">Sign in to CareLens AI</p>
<div id="err" class="alert hidden"></div>
<form id="login-form"><label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button class="btn primary full" type="submit">Sign in</button></form>
<p class="muted center">No account? <a href="/register">Create one</a></p></div></section>
<script>
document.getElementById('login-form').addEventListener('submit', async (e)=>{
e.preventDefault(); const f=e.target;
const body={email:f.email.value,password:f.password.value};
const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
if(r.ok){location.href='/dashboard';}else{const j=await r.json();let msg=j.detail||'Login failed';if(Array.isArray(msg)){msg=msg.map(d=>d.msg||JSON.stringify(d)).join('; ');}const el=document.getElementById('err');el.textContent=msg;el.classList.remove('hidden');}
});</script>
{% endblock %}
