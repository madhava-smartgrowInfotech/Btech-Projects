<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StoryVox writes an original story from your idea and narrates it aloud in 15 languages. Local-first." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StoryVox - Multilingual AI Storytelling</title>
    <script>
      // Apply the saved theme before first paint so there is no light flash in dark mode.
      try {
        var t = localStorage.getItem('sv.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
