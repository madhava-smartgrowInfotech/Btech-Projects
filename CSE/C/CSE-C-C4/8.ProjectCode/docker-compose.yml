services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: quantpulse-backend:1.0.0
    container_name: quantpulse-backend
    ports:
      - "8000:8000"
    environment:
      - NEWSAPI_KEY=${NEWSAPI_KEY:-}
      - QP_TICKERS=${QP_TICKERS:-TSLA,AAPL,AMZN,MSFT,GOOGL,NVDA,META,FDX,IBM,ORCL}
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: quantpulse-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 127.0.0.1 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    profiles: ["dev"]
