<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Campus Placement System - hybrid XGBoost + kNN placement prediction and Company-Role recommendation." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Campus Placement - Smart Campus Placement System</title>
    <script>
      // Apply the saved (or OS) theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('ts_theme')
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
