<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta
      name="description"
      content="TruthGlow screens news text as REAL, PARTIALLY TRUE or FAKE with a PCA + Firefly + MSVM model, and shows how confident it is and which cues it saw."
    />
    <title>TruthGlow - Fake news detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Grotesk:wght@500..700&display=swap"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Dark is the default look; "system" switches to light only when the OS asks for light.
      (function () {
        var dark = true;
        try {
          var t = localStorage.getItem("truthglow-theme") || "system";
          dark = t === "dark" || (t === "system" && !window.matchMedia("(prefers-color-scheme: light)").matches);
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0B0F1A" : "#F7F8FC");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
