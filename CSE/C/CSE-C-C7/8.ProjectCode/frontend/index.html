<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LearnPathIQ - personalized course recommendations with the reasons shown." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LearnPathIQ - Your learning path, with the reasons shown</title>
    <script>
      // Apply the saved (or OS) theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('lpq.theme')
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
